<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-PAC Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; font-family: 'Sarabun', sans-serif; }
        .form-container { max-width: 800px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .step-indicator { font-weight: bold; color: #0d6efd; margin-bottom: 20px; }
    </style>
</head>
<body>

<div class="container form-container">
    <h2 class="text-center mb-4">ฟอร์มลงทะเบียน P-PAC Registration</h2>
    
    <form id="ppacForm" onsubmit="submitForm(event)">
        
        <div id="step1" class="step active">
            <div class="step-indicator">ขั้นตอนที่ 1/4: ข้อมูลเบื้องต้นและการจอง</div>
            <div class="mb-3">
                <label class="form-label">ที่อยู่อีเมล <span class="text-danger">*</span></label>
                <input type="email" class="form-control" id="email" required placeholder="example@email.com">
            </div>
            <div class="mb-4">
                <label class="form-label">จำนวนผู้เข้ารับบริการ <span class="text-danger">*</span></label>
                <select class="form-select" id="customerCount" required>
                    <option value="1">1 ท่าน</option>
                    <option value="2">2 ท่าน</option>
                    <option value="3">3 ท่าน</option>
                    <option value="4">4 ท่าน</option>
                </select>
            </div>
            <div class="text-end">
                <button type="button" class="btn btn-primary" onclick="goToStep(2)">ถัดไป ➔</button>
            </div>
        </div>

        <div id="step2" class="step">
            <div class="step-indicator">ขั้นตอนที่ 2/4: ข้อมูลผู้เข้ารับบริการ</div>
            
            <div id="dynamicCustomersContainer"></div>

            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-secondary" onclick="goToStep(1)">⬅ ย้อนกลับ</button>
                <button type="button" class="btn btn-primary" onclick="goToStep(3)">ถัดไป ➔</button>
            </div>
        </div>

        <div id="step3" class="step">
            <div class="step-indicator">ขั้นตอนที่ 3/4: ข้อมูลสถานที่ติดต่อ</div>
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label">เบอร์โทรศัพท์มือถือ <span class="text-danger">*</span></label>
                    <input type="tel" class="form-control" id="phone" required pattern="[0-9]{10}" placeholder="08xxxxxxxx">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label">รหัสไปรษณีย์ <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="zipcode" required maxlength="5">
                </div>
                <div class="col-md-12 mb-3">
                    <label class="form-label">บ้านเลขที่ / ชื่ออาคาร / หมู่บ้าน <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" id="addressLine1" required>
                </div>
                <div class="col-md-6 mb-3"><label class="form-label">ซอย</label><input type="text" class="form-control"></div>
                <div class="col-md-6 mb-3"><label class="form-label">ถนน</label><input type="text" class="form-control"></div>
                <div class="col-md-4 mb-3"><label class="form-label">แขวง/ตำบล</label><input type="text" class="form-control" required></div>
                <div class="col-md-4 mb-3"><label class="form-label">เขต/อำเภอ</label><input type="text" class="form-control" required></div>
                <div class="col-md-4 mb-3"><label class="form-label">จังหวัด</label><input type="text" class="form-control" required></div>
            </div>
            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-secondary" onclick="goToStep(2)">⬅ ย้อนกลับ</button>
                <button type="button" class="btn btn-primary" onclick="goToStep(4)">ถัดไป ➔</button>
            </div>
        </div>

        <div id="step4" class="step">
            <div class="step-indicator">ขั้นตอนที่ 4/4: ข้อมูลเพิ่มเติม</div>
            <div class="mb-3">
                <label class="form-label">ช่องทางการรู้จักเรา (เลือกได้มากกว่า 1)</label>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="Facebook"><label class="form-check-label">Facebook</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="Line"><label class="form-check-label">Line@</label></div>
                <div class="form-check"><input class="form-check-input" type="checkbox" value="Recommend"><label class="form-check-label">มีผู้แนะนำ</label></div>
            </div>
            <div class="mb-3">
                <label class="form-label">สมาชิกที่เคยทำ (เคยมีบุคคลในครอบครัวรับบริการหรือไม่?) <span class="text-danger">*</span></label>
                <select class="form-select" id="hasFamily" onchange="toggleFamilyFields()" required>
                    <option value="">-- โปรดเลือก --</option>
                    <option value="no">ไม่มี</option>
                    <option value="yes">มี</option>
                </select>
            </div>
            
            <div id="familyDetails" style="display: none; background: #f8f9fa; padding: 15px; border-radius: 8px;">
                <div class="mb-3">
                    <label class="form-label">ชื่อสมาชิกที่เคยทำ และสถานะความสัมพันธ์</label>
                    <input type="text" class="form-control" placeholder="เช่น นายสมชาย ใจดี / บิดา">
                </div>
                <div class="mb-3">
                    <label class="form-label">เลขบัตรประจำตัวประชาชนของผู้แนะนำ / สมาชิกที่เคยทำ</label>
                    <input type="text" class="form-control" maxlength="13">
                </div>
            </div>

            <div class="d-flex justify-content-between mt-4">
                <button type="button" class="btn btn-secondary" onclick="goToStep(3)">⬅ ย้อนกลับ</button>
                <button type="submit" class="btn btn-success">✅ ยืนยันการลงทะเบียน</button>
            </div>
        </div>

    </form>
</div>

<script>
    // ฟังก์ชันเปลี่ยนหน้า Step
    function goToStep(stepNumber) {
        if (stepNumber === 2) {
            generateCustomerFields(); // สร้างฟอร์มผู้ใช้ตามจำนวนที่ระบุ
        }
        document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
        document.getElementById('step' + stepNumber).classList.add('active');
        window.scrollTo(0, 0);
    }

    // ฟังก์ชันสร้างช่องกรอกข้อมูลอัตโนมัติตามจำนวนคน
    function generateCustomerFields() {
        const count = document.getElementById('customerCount').value;
        const container = document.getElementById('dynamicCustomersContainer');
        container.innerHTML = ''; 

        for(let i = 1; i <= count; i++) {
            let html = `
                <div class="card mb-4 border-primary">
                    <div class="card-header bg-primary text-white fw-bold">ผู้เข้ารับบริการท่านที่ ${i}</div>
                    <div class="card-body row">
                        <div class="col-md-3 mb-3">
                            <label class="form-label">คำนำหน้า <span class="text-danger">*</span></label>
                            <select class="form-select" required>
                                <option value="">เลือก</option>
                                <option value="ด.ช.">ด.ช.</option><option value="ด.ญ.">ด.ญ.</option>
                                <option value="นาย">นาย</option><option value="นาง">นาง</option><option value="น.ส.">น.ส.</option>
                            </select>
                        </div>
                        <div class="col-md-9 mb-3">
                            <label class="form-label">ชื่อ-สกุล <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">วัน/เดือน/ปีเกิด <span class="text-danger">*</span></label>
                            <input type="date" class="form-control" max="${new Date().toISOString().split('T')[0]}" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">เลขบัตร ปชช. (หรือกรอก 0 สิบสามตัว) <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" maxlength="13" required pattern="[0-9]{13}">
                        </div>
                        <div class="col-md-12 mb-3">
                            <label class="form-label">อาชีพ / ระดับชั้นเรียน <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" required placeholder="เช่น นักศึกษา, ธุรกิจส่วนตัว">
                        </div>
                        <div class="col-md-12 mb-2">
                            <label class="form-label">สถานที่ทำงาน / สถาบันการศึกษา</label>
                            <input type="text" class="form-control">
                        </div>
                    </div>
                </div>`;
            container.innerHTML += html;
        }
    }

    // ฟังก์ชันซ่อน/แสดงช่องกรอกข้อมูลครอบครัว (Step 4)
    function toggleFamilyFields() {
        const hasFamily = document.getElementById('hasFamily').value;
        const familyDetails = document.getElementById('familyDetails');
        if (hasFamily === 'yes') {
            familyDetails.style.display = 'block';
        } else {
            familyDetails.style.display = 'none';
        }
    }

    // ฟังก์ชันจัดการตอนกด Submit
    function submitForm(event) {
        event.preventDefault(); // ป้องกันการรีเฟรชหน้า
        
        // ตรงนี้สามารถใส่ Logic ยิง API ไปยัง Google Apps Script, Formspree หรือ Backend ของคุณได้
        alert("✅ ยืนยันการลงทะเบียนสำเร็จ! (นี่คือหน้า Demo ข้อมูลยังไม่ถูกส่งเข้า Database จริง)");
        
        // รีเซ็ตฟอร์มกลับไปหน้าแรก
        document.getElementById('ppacForm').reset();
        goToStep(1);
    }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
