<!-- ใช้แทนไฟล์เดิมได้เลย -->
<style>
:root{
  --bg:#f7f9fc;
  --card:#ffffffcc;
  --text:#0f172a;
  --muted:#64748b;
  --brand:#0085FD;
  --brand2:#ffcd00;
  --line:#e5eaf3;
  --success:#12b981;
  --shadow:0 24px 70px rgba(15,23,42,.10);
}

*{box-sizing:border-box}

body{
  font-family:'Inter','Sarabun',sans-serif;
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at top left, rgba(0,133,253,.16), transparent 32%),
    radial-gradient(circle at bottom right, rgba(255,205,0,.20), transparent 30%),
    linear-gradient(135deg,#fbfdff,#f3f7fb);
  padding:48px 18px;
}

/* Background */
.ambient-bg{
  position:fixed;
  inset:0;
  z-index:-1;
  overflow:hidden;
}
.ambient-bg::before{
  content:"";
  position:absolute;
  width:520px;
  height:520px;
  border-radius:50%;
  background:rgba(0,133,253,.10);
  filter:blur(80px);
  top:-160px;
  left:-140px;
}
.ambient-bg::after{
  content:"";
  position:absolute;
  width:420px;
  height:420px;
  border-radius:50%;
  background:rgba(255,205,0,.18);
  filter:blur(90px);
  right:-120px;
  bottom:-120px;
}

/* Language */
.lang-switch{
  position:fixed;
  top:22px;
  right:22px;
  z-index:50;
  display:flex;
  gap:6px;
  padding:6px;
  border-radius:999px;
  background:rgba(255,255,255,.72);
  backdrop-filter:blur(18px);
  border:1px solid rgba(255,255,255,.85);
  box-shadow:0 12px 30px rgba(15,23,42,.08);
}
.lang-btn{
  border:0;
  padding:8px 16px;
  border-radius:999px;
  background:transparent;
  font-weight:700;
  font-size:.82rem;
  color:var(--muted);
  transition:.25s;
}
.lang-btn.active{
  background:var(--brand);
  color:white;
  box-shadow:0 8px 20px rgba(0,133,253,.25);
}

/* Header */
.header-text{
  max-width:920px;
  margin:0 auto 34px;
  text-align:center;
}
.header-text h1{
  font-size:clamp(2.5rem,6vw,4.6rem);
  letter-spacing:-.06em;
  font-weight:800;
  margin:0;
  background:linear-gradient(135deg,var(--brand),#005fc9);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}
.header-text h3{
  margin-top:10px;
  font-size:1.05rem;
  line-height:1.7;
  color:var(--muted);
  font-weight:500;
}

/* Stepper */
.step-wrapper{
  max-width:920px;
  margin:0 auto 28px;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  position:relative;
  gap:8px;
}
.step-wrapper::before{
  content:"";
  position:absolute;
  top:22px;
  left:8%;
  right:8%;
  height:3px;
  background:var(--line);
  border-radius:999px;
}
.step-progress-line{
  position:absolute;
  top:22px;
  left:8%;
  height:3px;
  width:0%;
  max-width:84%;
  background:linear-gradient(90deg,var(--brand),var(--brand2));
  border-radius:999px;
  transition:.45s ease;
}
.step-item{
  position:relative;
  z-index:2;
  text-align:center;
}
.step-icon{
  width:46px;
  height:46px;
  margin:0 auto;
  border-radius:50%;
  display:grid;
  place-items:center;
  background:white;
  border:2px solid var(--line);
  color:#94a3b8;
  font-weight:800;
  box-shadow:0 8px 22px rgba(15,23,42,.06);
  transition:.3s;
}
.step-label{
  margin-top:10px;
  font-size:.76rem;
  font-weight:700;
  color:#94a3b8;
}
.step-item.active .step-icon{
  background:var(--brand);
  color:white;
  border-color:var(--brand);
  transform:translateY(-3px) scale(1.04);
  box-shadow:0 16px 32px rgba(0,133,253,.28);
}
.step-item.active .step-label{color:var(--brand)}
.step-item.completed .step-icon{
  background:var(--success);
  color:white;
  border-color:var(--success);
}
.step-item.completed .step-label{color:var(--success)}

/* Main Card */
.glass-card{
  max-width:920px;
  margin:0 auto;
  padding:42px;
  border-radius:32px;
  background:var(--card);
  backdrop-filter:blur(24px);
  border:1px solid rgba(255,255,255,.88);
  box-shadow:var(--shadow);
  animation:cardIn .5s ease both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:none}
}

.step-content{display:none}
.step-content.active{
  display:block;
  animation:fadeUp .35s ease both;
}
@keyframes fadeUp{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:none}
}

/* Form */
.form-label{
  font-size:.92rem;
  font-weight:700;
  color:#172033;
  margin-bottom:8px;
}
.sub-text{
  display:block;
  font-size:.8rem;
  color:var(--muted);
  margin-top:4px;
}
.form-control,
.form-select{
  min-height:52px;
  border-radius:16px;
  border:1px solid #dbe3ef;
  background:rgba(255,255,255,.88);
  padding:13px 16px;
  font-size:.96rem;
  transition:.22s;
}
.form-control:hover,
.form-select:hover{
  border-color:#b8c7dd;
}
.form-control:focus,
.form-select:focus{
  border-color:var(--brand);
  box-shadow:0 0 0 5px rgba(0,133,253,.13);
}

/* Checkbox */
.form-check{
  padding:16px 18px 16px 44px;
  background:white;
  border:1px solid #e6edf6;
  border-radius:18px;
  min-height:56px;
  box-shadow:0 8px 24px rgba(15,23,42,.04);
}
.form-check-input{
  margin-left:-28px;
  margin-top:4px;
  width:18px;
  height:18px;
  border-color:#cbd5e1;
}
.form-check-input:checked{
  background-color:var(--brand);
  border-color:var(--brand);
}
.form-check-label{
  font-weight:600;
  color:#26344d;
}

/* Dynamic customer cards */
#dynamicCustomersContainer > div{
  background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,.72)) !important;
  border:1px solid #e6edf6 !important;
  border-radius:24px !important;
  box-shadow:0 14px 36px rgba(15,23,42,.06);
}
#dynamicCustomersContainer h5{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 14px;
  border-radius:999px;
  background:rgba(0,133,253,.09);
  color:var(--brand) !important;
}

/* Family box */
#familyDetails{
  background:linear-gradient(180deg,#ffffff,#f8fbff) !important;
  border:1px solid #e6edf6;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.9);
}

/* Buttons */
.btn-next,
.btn-back{
  min-height:50px;
  border-radius:999px;
  padding:12px 28px;
  font-weight:800;
  letter-spacing:-.01em;
  transition:.25s;
}
.btn-next{
  border:0;
  color:white;
  background:linear-gradient(135deg,var(--brand),#0069d9);
  box-shadow:0 14px 30px rgba(0,133,253,.26);
}
.btn-next:hover{
  transform:translateY(-2px);
  box-shadow:0 18px 36px rgba(0,133,253,.32);
}
.btn-back{
  background:white;
  color:#334155;
  border:1px solid #dbe3ef;
}
.btn-back:hover{
  transform:translateY(-2px);
  background:#f8fafc;
}

/* Mobile */
@media(max-width:768px){
  body{padding:78px 14px 30px}
  .glass-card{
    padding:24px;
    border-radius:26px;
  }
  .step-label{display:none}
  .step-icon{
    width:40px;
    height:40px;
    font-size:.85rem;
  }
  .step-wrapper::before,
  .step-progress-line{
    top:19px;
  }
  .d-flex.justify-content-between{
    gap:12px;
  }
  .btn-next,
  .btn-back{
    width:100%;
    padding:12px 18px;
  }
}
</style>
