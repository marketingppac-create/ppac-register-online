<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-PAC Registration</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* ================= สีและสไตล์พื้นฐาน ================= */
        :root {
            --bg-off-white: #F8F9FA;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent-color: #2563EB; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center; /* จัดฟอร์มให้อยู่กลางหน้าจอแนวตั้ง */
            padding: 40px 0;
        }

        /* ================= พื้นหลังแสงออร่า (Ambient Effect) ================= */
        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: var(--bg-off-white);
        }
        .ambient-bg::before, .ambient-bg::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.4;
        }
        .ambient-bg::before { width: 60vw; height: 60vw; background: #E0E7FF; top: -10%; left: -10%; }
        .ambient-bg::after { width: 50vw; height: 50vw; background: #F3E8FF; bottom: -10%; right: -10%; }

        /* ================= โลโก้ด้านบนฟอร์ม ================= */
        .logo-header {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-header img {
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.05));
        }

        /* ================= Glass Card (กล่องฟอร์ม) ================= */
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.04);
            max-width: 750px;
            width: 100%;
            margin: auto;
        }

        /* ================= Step Logic & UI ================= */
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .step-indicator { 
            font-weight: 500; 
            color: var(--accent-color); 
            margin-bottom: 25px; 
            font-size: 0.85rem; 
            text-transform: uppercase; 
            letter-spacing: 1.5px;
            border-left: 3px solid var(--accent-color);
            padding-left: 15px;
        }

        /* ================= Form Elements ================= */
        h2 { font-weight: 300; font-size: 1.8rem; margin-bottom: 30px; letter-spacing: -0.02em; }
        .form-label { font-weight: 500; font-size: 0.85rem; color: var(--text-primary); margin-bottom: 8px; }
        .form-control, .form-select { 
            background-color: rgba(255, 255, 255, 0.6); 
            border: 1px solid #E5E7EB; 
            border-radius: 12px; 
            padding: 12px 18px;
            font-weight: 300;
        }
        .form-control:focus { box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.08); border-color: var(--accent-color); }

        /* ================= Buttons ================= */
        .btn-next {
            background-color: var(--accent-color); color: white;
            padding: 14px 40px; border-radius: 50px; border: none;
            font-weight: 500; transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
        }
        .btn-next:hover { transform: translateY(-2px); box-shadow: 0 12px 25px rgba(37, 99, 235, 0.3); background-color: #1D4ED8; }
        
        .btn-back {
            color: var(--text-secondary); background: transparent; border: 1px solid #E5E7EB;
            padding: 14px 30px; border-radius: 50px; font-weight: 400; transition: all 0.3s;
        }
        .btn-back:hover { background: #F3F4F6; color: var(--text-primary); }

        @media (max-width: 600px) {
            .glass-card { padding: 30px 20px; border-radius: 20px; }
            body { padding: 20px; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="container d-flex flex-column align-items-center">
        
        <div class="logo-header">
            <img src="https://drive.google.com/uc?id=1fLOl5QKO3ZXXsstn14_VB9G26hhPCzkQ" alt="P-PAC Logo">
        </div>

        <div class="glass-card">
            <h2>Registration <strong>Form</strong></h2>
            
            <form id="ppacForm" onsubmit="submitForm(event)">
                
                <div id="step1" class="step active">
                    <div class="step-indicator">Step 1: Reservation Info</div>
                    <div class="mb-4">
                        <label class="form-label">Email Address *</label>
                        <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="mb-5">
                        <label class="form-label">จำนวนผู้เข้ารับบริการ *</label>
                        <select class="form-select" id="customerCount" required>
                            <option value="1">1 ท่าน (1 Person)</option>
                            <option value="2">2 ท่าน (2 Persons)</option>
                            <option value="3">3 ท่าน (3 Persons)</option>
                            <option value="4">4 ท่าน (4 Persons)</option>
                        </select>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn-next" onclick="goToStep(2)">Continue ➔</button>
                    </div>
                </div>

                <div id="step2" class="step">
                    <div class="step-indicator">Step 2: Personal Details</div>
                    <div id="dynamicCustomersContainer"></div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back" onclick="goToStep(1)">Back</button>
                        <button type="button" class="btn-next" onclick="goToStep(3)">Continue ➔</button>
                    </div>
                </div>

                <div id="step3" class="step">
                    <div class="step-indicator">Step 3: Contact & Address</div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label">เบอร์โทรศัพท์มือถือ *</label><input type="tel" class="form-control" required maxlength="10"></div>
                        <div class="col-md-6 mb-3"><label class="form-label">รหัสไปรษณีย์ *</label><input type="text" class="form-control" required maxlength="5"></div>
                        <div class="col-md-12 mb-3"><label class="form-label">บ้านเลขที่ / หมู่บ้าน *</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">แขวง/ตำบล</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">เขต/อำเภอ</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label">จังหวัด</label><input type="text" class="form-control" required></div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back" onclick="goToStep(2)">Back</button>
                        <button type="button" class="btn-next" onclick="goToStep(4)">Continue ➔</button>
                    </div>
                </div>

                <div id="step4" class="step">
                    <div class="step-indicator">Step 4: Additional</div>
                    <div class="mb-4">
                        <label class="form-label">รู้จักเราผ่านช่องทางใด</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="FB"><label class="form-check-label text-secondary">Facebook</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Line"><label class="form-check-label text-secondary">Line@</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Rec"><label class="form-check-label text-secondary">ผู้แนะนำ</label></div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">เคยมีบุคคลในครอบครัวรับบริการหรือไม่? *</label>
                        <select class="form-select" id="hasFamily" onchange="toggleFamilyFields()" required>
                            <option value="">-- โปรดเลือก --</option>
                            <option value="no">ไม่มี (No)</option>
                            <option value="yes">มี (Yes)</option>
                        </select>
                    </div>
                    <div id="familyDetails" style="display: none; background: rgba(0,0,0,0.02); padding: 20px; border-radius: 15px; margin-bottom: 20px;">
                        <input type="text" class="form-control mb-3" placeholder="ชื่อสมาชิกและสถานะความสัมพันธ์">
                        <input type="text" class="form-control" placeholder="เลขบัตรประชาชนผู้แนะนำ" maxlength="13">
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back" onclick="goToStep(3)">Back</button>
                        <button type="submit" class="btn-next" style="background-color: #10B981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);">Confirm Registration</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script>
        function goToStep(num) {
            if (num === 2) generateCustomerFields();
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + num).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function generateCustomerFields() {
            const count = document.getElementById('customerCount').value;
            const container = document.getElementById('dynamicCustomersContainer');
            container.innerHTML = ''; 
            for(let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="p-4 mb-4" style="background: rgba(255,255,255,0.4); border: 1px solid #E5E7EB; border-radius: 18px;">
                        <div class="mb-3" style="font-weight: 600; color: var(--accent-color); font-size: 0.9rem;">ท่านที่ ${i}</div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">คำนำหน้า *</label><select class="form-select" required><option value="">เลือก</option><option value="นาย">นาย</option><option value="นาง">นาง</option><option value="น.ส.">น.ส.</option><option value="ด.ช.">ด.ช.</option><option value="ด.ญ.">ด.ญ.</option></select></div>
                            <div class="col-md-8 mb-3"><label class="form-label">ชื่อ-สกุล *</label><input type="text" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">วัน/เดือน/ปีเกิด *</label><input type="date" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">เลขบัตร ปชช. *</label><input type="text" class="form-control" maxlength="13" required pattern="[0-9]{13}"></div>
                        </div>
                    </div>`;
            }
        }

        function toggleFamilyFields() {
            const val = document.getElementById('hasFamily').value;
            document.getElementById('familyDetails').style.display = val === 'yes' ? 'block' : 'none';
        }

        function submitForm(event) {
            event.preventDefault();
            alert("✅ ขอบคุณสำหรับการลงทะเบียน ข้อมูลของคุณถูกส่งเรียบร้อยแล้ว");
            location.reload();
        }
    </script>
</body>
</html>
