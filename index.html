<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-PAC Registration | แบบลงทะเบียน</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Sarabun:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-off-white: #F8F9FA;
            --text-primary: #111827;
            --text-secondary: #6B7280;
            --accent-color: #2563EB; 
        }

        body {
            font-family: 'Inter', 'Sarabun', sans-serif;
            background-color: var(--bg-off-white);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        .ambient-bg {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: var(--bg-off-white);
        }
        .ambient-bg::before, .ambient-bg::after {
            content: ''; position: absolute; border-radius: 50%;
            filter: blur(100px); opacity: 0.35;
        }
        .ambient-bg::before { width: 60vw; height: 60vw; background: #E0E7FF; top: -10%; left: -10%; }
        .ambient-bg::after { width: 50vw; height: 50vw; background: #F3E8FF; bottom: -10%; right: -10%; }

        /* --- Language Switcher --- */
        .lang-switch {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            padding: 5px;
            border-radius: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .lang-btn {
            border: none;
            background: transparent;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            color: var(--text-secondary);
        }
        .lang-btn.active {
            background-color: var(--accent-color);
            color: white;
            box-shadow: 0 4px 10px rgba(37, 99, 235, 0.2);
        }

        .logo-header { text-align: center; margin-top: 40px; margin-bottom: 30px; }
        .logo-header img {
            height: 80px;
            object-fit: contain;
            filter: drop-shadow(0 8px 15px rgba(0,0,0,0.08));
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 1);
            border-radius: 30px;
            padding: 50px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.05);
            max-width: 750px;
            width: 90%;
            margin: 20px auto;
        }

        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.6s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .step-indicator { 
            font-weight: 500; color: var(--accent-color); 
            margin-bottom: 25px; font-size: 0.8rem; 
            text-transform: uppercase; letter-spacing: 1.5px;
            border-left: 3px solid var(--accent-color); padding-left: 15px;
        }

        h2 { font-weight: 300; font-size: 1.8rem; margin-bottom: 30px; }
        .form-label { font-weight: 500; font-size: 0.85rem; margin-bottom: 8px; }
        .form-control, .form-select { 
            background-color: rgba(255, 255, 255, 0.6); 
            border: 1px solid #E5E7EB; border-radius: 12px; padding: 12px 18px;
        }

        .btn-next {
            background-color: var(--accent-color); color: white;
            padding: 14px 40px; border-radius: 50px; border: none;
            font-weight: 500; box-shadow: 0 8px 20px rgba(37, 99, 235, 0.2);
            transition: all 0.3s;
        }
        .btn-next:hover { transform: translateY(-2px); background-color: #1D4ED8; color: white; }
        
        .btn-back {
            color: var(--text-secondary); background: transparent; border: 1px solid #E5E7EB;
            padding: 14px 30px; border-radius: 50px; transition: all 0.3s;
        }
        .btn-back:hover { background: #F3F4F6; }

        @media (max-width: 600px) {
            .glass-card { padding: 30px 20px; }
            .hero h1 { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="ambient-bg"></div>

    <div class="lang-switch">
        <button class="lang-btn active" id="btn-th" onclick="setLanguage('th')">TH</button>
        <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
    </div>

    <div class="container d-flex flex-column align-items-center">
        <div class="logo-header">
            <img src="https://drive.google.com/uc?id=1fLOl5QKO3ZXXsstn14_VB9G26hhPCzkQ" alt="P-PAC Logo" onerror="this.src='https://via.placeholder.com/200x80?text=P-PAC+LOGO'">
        </div>

        <div class="glass-card">
            <h2 id="form-title">แบบลงทะเบียน <strong>P-PAC</strong></h2>
            
            <form id="ppacForm" onsubmit="submitForm(event)">
                
                <div id="step1" class="step active">
                    <div class="step-indicator" id="step1-tag">ขั้นตอนที่ 1: ข้อมูลเบื้องต้น</div>
                    <div class="mb-4">
                        <label class="form-label" id="lbl-email">อีเมล (Email Address) *</label>
                        <input type="email" class="form-control" id="email" required placeholder="name@example.com">
                    </div>
                    <div class="mb-5">
                        <label class="form-label" id="lbl-count">จำนวนผู้เข้ารับบริการ *</label>
                        <select class="form-select" id="customerCount" required>
                            <option value="1">1 ท่าน (1 Person)</option>
                            <option value="2">2 ท่าน (2 Persons)</option>
                            <option value="3">3 ท่าน (3 Persons)</option>
                            <option value="4">4 ท่าน (4 Persons)</option>
                        </select>
                    </div>
                    <div class="text-end">
                        <button type="button" class="btn-next btn-txt-next" onclick="goToStep(2)">ถัดไป ➔</button>
                    </div>
                </div>

                <div id="step2" class="step">
                    <div class="step-indicator" id="step2-tag">ขั้นตอนที่ 2: ข้อมูลส่วนตัว</div>
                    <div id="dynamicCustomersContainer"></div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back btn-txt-back" onclick="goToStep(1)">ย้อนกลับ</button>
                        <button type="button" class="btn-next btn-txt-next" onclick="goToStep(3)">ถัดไป ➔</button>
                    </div>
                </div>

                <div id="step3" class="step">
                    <div class="step-indicator" id="step3-tag">ขั้นตอนที่ 3: สถานที่ติดต่อ</div>
                    <div class="row">
                        <div class="col-md-6 mb-3"><label class="form-label" id="lbl-phone">เบอร์โทรศัพท์ *</label><input type="tel" class="form-control" required maxlength="10"></div>
                        <div class="col-md-6 mb-3"><label class="form-label" id="lbl-zip">รหัสไปรษณีย์ *</label><input type="text" class="form-control" required maxlength="5"></div>
                        <div class="col-md-12 mb-3"><label class="form-label" id="lbl-addr">ที่อยู่ (เลขที่บ้าน/หมู่บ้าน) *</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label" id="lbl-subdist">แขวง/ตำบล</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label" id="lbl-dist">เขต/อำเภอ</label><input type="text" class="form-control" required></div>
                        <div class="col-md-4 mb-3"><label class="form-label" id="lbl-prov">จังหวัด</label><input type="text" class="form-control" required></div>
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back btn-txt-back" onclick="goToStep(2)">ย้อนกลับ</button>
                        <button type="button" class="btn-next btn-txt-next" onclick="goToStep(4)">ถัดไป ➔</button>
                    </div>
                </div>

                <div id="step4" class="step">
                    <div class="step-indicator" id="step4-tag">ขั้นตอนที่ 4: ข้อมูลเพิ่มเติม</div>
                    <div class="mb-4">
                        <label class="form-label" id="lbl-source">รู้จักเราผ่านช่องทางใด</label>
                        <div class="d-flex gap-3 flex-wrap">
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="FB"><label class="form-check-label text-secondary">Facebook</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Line"><label class="form-check-label text-secondary">Line@</label></div>
                            <div class="form-check"><input class="form-check-input" type="checkbox" value="Rec"><label class="form-check-label text-secondary" id="txt-rec">ผู้แนะนำ</label></div>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label" id="lbl-family">เคยมีบุคคลในครอบครัวรับบริการหรือไม่? *</label>
                        <select class="form-select" id="hasFamily" onchange="toggleFamilyFields()" required>
                            <option value="" id="opt-select">-- โปรดเลือก --</option>
                            <option value="no" id="opt-no">ไม่มี (No)</option>
                            <option value="yes" id="opt-yes">มี (Yes)</option>
                        </select>
                    </div>
                    <div id="familyDetails" style="display: none; background: rgba(0,0,0,0.02); padding: 20px; border-radius: 15px; margin-bottom: 20px;">
                        <input type="text" class="form-control mb-3" id="in-famname" placeholder="ชื่อสมาชิกและสถานะความสัมพันธ์">
                        <input type="text" class="form-control" id="in-famid" placeholder="เลขบัตรประชาชนผู้แนะนำ" maxlength="13">
                    </div>
                    <div class="d-flex justify-content-between mt-4">
                        <button type="button" class="btn-back btn-txt-back" onclick="goToStep(3)">ย้อนกลับ</button>
                        <button type="submit" id="btn-submit" class="btn-next" style="background-color: #10B981; box-shadow: 0 8px 20px rgba(16, 185, 129, 0.2);">ยืนยันลงทะเบียน (Confirm)</button>
                    </div>
                </div>

            </form>
        </div>
    </div>

    <script>
        let currentLang = 'th';

        const translations = {
            th: {
                title: "แบบลงทะเบียน <strong>P-PAC</strong>",
                step1Tag: "ขั้นตอนที่ 1: ข้อมูลเบื้องต้น",
                step2Tag: "ขั้นตอนที่ 2: ข้อมูลส่วนตัว",
                step3Tag: "ขั้นตอนที่ 3: สถานที่ติดต่อ",
                step4Tag: "ขั้นตอนที่ 4: ข้อมูลเพิ่มเติม",
                email: "อีเมล (Email Address) *",
                count: "จำนวนผู้เข้ารับบริการ *",
                next: "ถัดไป ➔",
                back: "ย้อนกลับ",
                phone: "เบอร์โทรศัพท์ *",
                zip: "รหัสไปรษณีย์ *",
                addr: "ที่อยู่ (เลขที่บ้าน/หมู่บ้าน) *",
                subdist: "แขวง/ตำบล",
                dist: "เขต/อำเภอ",
                prov: "จังหวัด",
                source: "รู้จักเราผ่านช่องทางใด",
                rec: "ผู้แนะนำ",
                family: "เคยมีบุคคลในครอบครัวรับบริการหรือไม่? *",
                select: "-- โปรดเลือก --",
                no: "ไม่มี (No)",
                yes: "มี (Yes)",
                famname: "ชื่อสมาชิกและสถานะความสัมพันธ์",
                famid: "เลขบัตรประชาชนผู้แนะนำ",
                submit: "ยืนยันลงทะเบียน (Confirm)",
                success: "✅ ขอบคุณสำหรับการลงทะเบียน ข้อมูลของคุณถูกส่งเรียบร้อยแล้ว",
                custTitle: "ผู้เข้ารับบริการท่านที่",
                prefix: "คำนำหน้า",
                name: "ชื่อ-สกุล",
                dob: "วัน/เดือน/ปีเกิด",
                idcard: "เลขบัตรประชาชน",
                career: "อาชีพ / ระดับชั้นเรียน"
            },
            en: {
                title: "<strong>P-PAC</strong> Registration",
                step1Tag: "Step 1: Initial Info",
                step2Tag: "Step 2: Personal Details",
                step3Tag: "Step 3: Contact & Address",
                step4Tag: "Step 4: Additional",
                email: "Email Address *",
                count: "Number of Customers *",
                next: "Next ➔",
                back: "Back",
                phone: "Mobile Phone *",
                zip: "Zip Code *",
                addr: "Address (House No. / Village) *",
                subdist: "Sub-district",
                dist: "District",
                prov: "Province",
                source: "How did you hear about us?",
                rec: "Referral",
                family: "Have family members used our service? *",
                select: "-- Please Select --",
                no: "No",
                yes: "Yes",
                famname: "Member name and Relationship",
                famid: "Referrer ID Number",
                submit: "Confirm Registration",
                success: "✅ Thank you! Your registration is complete.",
                custTitle: "Customer No.",
                prefix: "Title",
                name: "Full Name",
                dob: "Date of Birth",
                idcard: "ID Number",
                career: "Career / Grade"
            }
        };

        function setLanguage(lang) {
            currentLang = lang;
            document.getElementById('btn-th').classList.toggle('active', lang === 'th');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            const t = translations[lang];
            document.getElementById('form-title').innerHTML = t.title;
            document.getElementById('step1-tag').innerText = t.step1Tag;
            document.getElementById('step2-tag').innerText = t.step2Tag;
            document.getElementById('step3-tag').innerText = t.step3Tag;
            document.getElementById('step4-tag').innerText = t.step4Tag;
            document.getElementById('lbl-email').innerText = t.email;
            document.getElementById('lbl-count').innerText = t.count;
            document.getElementById('lbl-phone').innerText = t.phone;
            document.getElementById('lbl-zip').innerText = t.zip;
            document.getElementById('lbl-addr').innerText = t.addr;
            document.getElementById('lbl-subdist').innerText = t.subdist;
            document.getElementById('lbl-dist').innerText = t.dist;
            document.getElementById('lbl-prov').innerText = t.prov;
            document.getElementById('lbl-source').innerText = t.source;
            document.getElementById('txt-rec').innerText = t.rec;
            document.getElementById('lbl-family').innerText = t.family;
            document.getElementById('opt-select').innerText = t.select;
            document.getElementById('opt-no').innerText = t.no;
            document.getElementById('opt-yes').innerText = t.yes;
            document.getElementById('in-famname').placeholder = t.famname;
            document.getElementById('in-famid').placeholder = t.famid;
            document.getElementById('btn-submit').innerText = t.submit;
            
            document.querySelectorAll('.btn-txt-next').forEach(b => b.innerText = t.next);
            document.querySelectorAll('.btn-txt-back').forEach(b => b.innerText = t.back);

            if (document.getElementById('step2').classList.contains('active')) {
                generateCustomerFields();
            }
        }

        function goToStep(num) {
            if (num === 2) generateCustomerFields();
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById('step' + num).classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function generateCustomerFields() {
            const count = document.getElementById('customerCount').value;
            const container = document.getElementById('dynamicCustomersContainer');
            const t = translations[currentLang];
            container.innerHTML = ''; 
            for(let i = 1; i <= count; i++) {
                container.innerHTML += `
                    <div class="p-4 mb-4" style="background: rgba(255,255,255,0.4); border: 1px solid #E5E7EB; border-radius: 18px;">
                        <div class="mb-3" style="font-weight: 600; color: var(--accent-color); font-size: 0.9rem;">${t.custTitle} ${i}</div>
                        <div class="row">
                            <div class="col-md-4 mb-3"><label class="form-label">${t.prefix} *</label><select class="form-select" required><option value="">--</option><option>Mr.</option><option>Mrs.</option><option>Ms.</option><option>Master</option></select></div>
                            <div class="col-md-8 mb-3"><label class="form-label">${t.name} *</label><input type="text" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">${t.dob} *</label><input type="date" class="form-control" required></div>
                            <div class="col-md-6 mb-3"><label class="form-label">${t.idcard} *</label><input type="text" class="form-control" maxlength="13" required pattern="[0-9]{13}"></div>
                            <div class="col-md-12 mb-3"><label class="form-label">${t.career} *</label><input type="text" class="form-control" required></div>
                        </div>
                    </div>`;
            }
        }

        function toggleFamilyFields() {
            const val = document.getElementById('hasFamily').value;
            document.getElementById('familyDetails').style.display = val === 'yes' ? 'block' : 'none';
        }

        function submitForm(event) {
            event.preventDefault();
            alert(translations[currentLang].success);
            location.reload();
        }
    </script>
</body>
</html>
